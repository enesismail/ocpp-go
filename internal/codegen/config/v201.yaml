goTree: ocpp2.0.1
typesPackage: ocpp2.0.1/types

# Every OCPP 2.0.1 message the vendored schema corpus defines. Only the four
# rows with emit: true produce generated files today; the rest are read and
# walked so shared types are placed correctly regardless of how many messages
# reference them, and so a schema-reading failure anywhere in the corpus is
# caught here rather than the first time a later row's emit flag flips on.
